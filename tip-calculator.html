<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week 3 Assignment: Tip Calculator</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #f4f4f9; }
        .calculator { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 350px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 500; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #28a745; color: white; border: none; padding: 0.75rem; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #218838; }
        .result-box { margin-top: 1.5rem; padding: 1rem; background: #e9ecef; border-radius: 4px; }
        .result-line { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>Tip Calculator</h2>

        <div class="form-group">
            <label for="billAmount">Bill Amount ($):</label>
            <input type="number" id="billAmount" placeholder="0.00" step="0.01">
        </div>

        <div class="form-group">
            <label for="tipPercent">Tip Percentage (%):</label>
            <input type="number" id="tipPercent" placeholder="15" value="15">
        </div>

        <button id="calcBtn">Calculate Total</button>

        <div class="result-box">
            <div class="result-line"><span>Tip Amount:</span> <span id="tipResult">$0.00</span></div>
            <div class="result-line"><strong>Total Bill:</strong> <strong id="totalResult">$0.00</strong></div>
        </div>
    </div>

    <script>
        /* ================================================================
           STEP 1 — the AI-generated calculation function.
           Pure maths: no event listeners, no DOM, exactly as the prompt
           in README.md demanded.
           ================================================================ */
        function calculateBillTotals(bill, tipPercentage) {
            var tipAmount = bill * tipPercentage / 100;
            var grandTotal = bill + tipAmount;

            // Round each value to 2 decimals, both derived from the UNROUNDED
            // tip. Rounding the tip first and then adding can disagree with
            // this by a cent on some inputs — see AUDIT-NOTES.md.
            //
            // These are returned as NUMBERS. toFixed() would return strings,
            // and the assignment asks for an object of values, not text. The
            // "$0.00" formatting happens in the display layer below.
            return {
                tipAmount: Math.round(tipAmount * 100) / 100,
                grandTotal: Math.round(grandTotal * 100) / 100
            };
        }

        /* ================================================================
           STEP 2 — implement and connect. Written by hand.
           ================================================================ */
        var billInput = document.getElementById("billAmount");
        var tipInput = document.getElementById("tipPercent");
        var calcButton = document.getElementById("calcBtn");
        var tipResultEl = document.getElementById("tipResult");
        var totalResultEl = document.getElementById("totalResult");

        calcButton.addEventListener("click", function () {
            // CRUCIAL: input .value is ALWAYS a string. Without parseFloat,
            // "50" + "10" would concatenate to "5010" instead of adding.
            var billValue = parseFloat(billInput.value);
            var tipValue = parseFloat(tipInput.value);

            // An empty field parses to NaN, which would render "$NaN".
            // Guard here in the display layer so the maths function stays
            // pure, as the prompt required.
            if (!isFinite(billValue)) {
                billValue = 0;
            }
            if (!isFinite(tipValue)) {
                tipValue = 0;
            }

            var totals = calculateBillTotals(billValue, tipValue);

            // toFixed(2) guarantees two decimals on screen, so 15 shows as
            // "15.00" rather than "15".
            tipResultEl.textContent = "$" + totals.tipAmount.toFixed(2);
            totalResultEl.textContent = "$" + totals.grandTotal.toFixed(2);
        });
    </script>
</body>
</html>
